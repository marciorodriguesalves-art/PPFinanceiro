# Produção — app FastAPI + PostgreSQL + Caddy (HTTPS automático).
# Uso no VPS:
#   cp .env.prod.example .env   # ajuste SECRET_KEY, senhas, SITE_ADDRESS
#   docker compose -f docker-compose.prod.yml up -d --build
# As variáveis vêm do arquivo .env (não versionado).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só é acessível dentro da rede do compose.

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Aplica as migrations e sobe o servidor. NÃO roda o seed de demonstração.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"   # exposto só para o Caddy, não para a internet.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
