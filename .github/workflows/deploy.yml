name: Deploy

# Dispara DEPOIS que o workflow "CI" termina com sucesso na branch main.
# Assim só publica código que passou no ruff + pytest. Também dá para
# disparar manualmente na aba Actions (workflow_dispatch).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No gatilho automático, só segue se o CI passou. No manual, segue sempre.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Enquanto os secrets do VPS não existirem, o deploy é ignorado (job verde,
      # sem erro). Assim que VPS_HOST for cadastrado, passa a deployar de verdade.
      - name: Verificar se o VPS está configurado
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets do VPS ainda não configurados — deploy ignorado. Veja DEPLOY.md."
          fi

      - name: Deploy no VPS via SSH
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
