name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orcamento
          POSTGRES_PASSWORD: orcamento
          POSTGRES_DB: orcamento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcamento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco usado pelo Alembic (validação das migrations) e pela aplicação.
      DATABASE_URL: postgresql+psycopg://orcamento:orcamento@localhost:5432/orcamento
      # Banco usado pelo pytest (mesmo servidor Postgres do serviço acima).
      TEST_DATABASE_URL: postgresql+psycopg://orcamento:orcamento@localhost:5432/orcamento
      SECRET_KEY: ci-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate migrations on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Run tests (pytest on PostgreSQL)
        run: pytest
